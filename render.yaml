services:
  - type: web
    name: rionegro-panel-web
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build:render
    preDeployCommand: npx prisma db push
    startCommand: npm run render:start
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: TZ
        value: America/Bogota
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: SCHEDULER_INTERVAL_SECONDS
        value: "60"
      - key: CRON_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: rionegro-panel-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: rionegro-panel-db
          property: connectionString
      - key: ADMIN_EMAIL
        value: admin@rionegro.gov
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MOCK
        value: "false"
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: OPENAI_TRANSCRIPTION_MODEL
        value: gpt-4o-mini-transcribe
      - key: ULTRAMSG_INSTANCE_ID
        sync: false
      - key: ULTRAMSG_BASE_URL
        sync: false
      - key: ULTRAMSG_API_URL
        sync: false
      - key: ULTRAMSG_TOKEN
        sync: false
      - key: ULTRAMSG_MOCK
        value: "false"
      - key: ULTRAMSG_DEFAULT_TO
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: ELEVENLABS_MOCK
        value: "false"
      - key: ELEVENLABS_MODEL_ID
        value: eleven_multilingual_v2
      - key: ELEVENLABS_OUTPUT_FORMAT
        value: mp3_44100_128
      - key: ELEVENLABS_LANGUAGE_CODE
        value: es
      - key: WHATSAPP_SAFE_MODE
        value: "true"
      - key: WHATSAPP_DRY_RUN
        value: "false"
      - key: SIMULATION_MODE
        value: "false"
      - key: WHATSAPP_AUDIO_REPLIES
        value: "true"
      - key: WHATSAPP_SEND_TEXT_WITH_AUDIO
        value: "false"
      - key: WHATSAPP_LANGUAGE
        value: es

  - type: worker
    name: rionegro-panel-scheduler
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma generate
    startCommand: npm run render:worker
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: TZ
        value: America/Bogota
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: SCHEDULER_INTERVAL_SECONDS
        value: "60"
      - key: CRON_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: rionegro-panel-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: rionegro-panel-db
          property: connectionString
      - key: ADMIN_EMAIL
        value: admin@rionegro.gov
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MOCK
        value: "false"
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: OPENAI_TRANSCRIPTION_MODEL
        value: gpt-4o-mini-transcribe
      - key: ULTRAMSG_INSTANCE_ID
        sync: false
      - key: ULTRAMSG_BASE_URL
        sync: false
      - key: ULTRAMSG_API_URL
        sync: false
      - key: ULTRAMSG_TOKEN
        sync: false
      - key: ULTRAMSG_MOCK
        value: "false"
      - key: ULTRAMSG_DEFAULT_TO
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: ELEVENLABS_MOCK
        value: "false"
      - key: ELEVENLABS_MODEL_ID
        value: eleven_multilingual_v2
      - key: ELEVENLABS_OUTPUT_FORMAT
        value: mp3_44100_128
      - key: ELEVENLABS_LANGUAGE_CODE
        value: es
      - key: WHATSAPP_SAFE_MODE
        value: "true"
      - key: WHATSAPP_DRY_RUN
        value: "false"
      - key: SIMULATION_MODE
        value: "false"
      - key: WHATSAPP_AUDIO_REPLIES
        value: "true"
      - key: WHATSAPP_SEND_TEXT_WITH_AUDIO
        value: "false"
      - key: WHATSAPP_LANGUAGE
        value: es

databases:
  - name: rionegro-panel-db
    plan: basic-256mb
    postgresMajorVersion: "16"
