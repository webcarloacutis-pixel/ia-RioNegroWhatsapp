services:
  - type: web
    name: rionegro-panel-web
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma generate && npm run build
    preDeployCommand: npx prisma db push
    startCommand: npm run render:start
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: rionegro-panel-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: rionegro-panel-db
          property: connectionString
      - key: ADMIN_EMAIL
        value: admin@rionegro.gov
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: ULTRAMSG_API_URL
        sync: false
      - key: ULTRAMSG_TOKEN
        sync: false
      - key: ULTRAMSG_DEFAULT_TO
        sync: false

  - type: worker
    name: rionegro-panel-scheduler
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma generate
    startCommand: npm run render:worker
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: rionegro-panel-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: rionegro-panel-db
          property: connectionString
      - key: ADMIN_EMAIL
        value: admin@rionegro.gov
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: ULTRAMSG_API_URL
        sync: false
      - key: ULTRAMSG_TOKEN
        sync: false
      - key: ULTRAMSG_DEFAULT_TO
        sync: false

databases:
  - name: rionegro-panel-db
    plan: basic-256mb
    postgresMajorVersion: "16"
